name: MLOps CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        # Ensure pytest and httpx are installed for tests
        python -m pip install pytest httpx

    - name: Initialize DVC (for CI environment)
      run: |
        dvc init --no-scm
        # Ensure artifacts directory exists
        mkdir -p artifacts

    - name: Run Tests (Unit, Integration)
      run: |
        pytest tests/ -v

    - name: Download tiny test model
      run: |
        python -m pip install huggingface_hub
        python -c "from huggingface_hub import snapshot_download; snapshot_download('hf-internal-testing/tiny-random-gpt2', local_dir='artifacts/tiny-model')"

    - name: Build Docker Image
      run: |
        docker build -t mlops-api .
        
    - name: Test API Endpoints (in Docker)
      run: |
        # Run the Docker container
        # Map port 8000 to 8000
        docker run -d --name mlops-api-container -p 8000:8000 \
          -e SKIP_TELEMETRY=1 \
          -e MODEL_PATH=/app/artifacts/tiny-model \
          -e MODEL_NAME=tiny-random-gpt2 \
          mlops-api
        
        # Wait for API startup
        # Add an initial sleep to allow the container to start
        sleep 10
        STARTUP_SUCCESS=false
        for i in {1..60}; do
          # Add --connect-timeout to curl to give it a chance to connect
          if curl -sSf --connect-timeout 2 http://127.0.0.1:8000/health > /dev/null; then
            STARTUP_SUCCESS=true
            break
          fi
          sleep 1
        done

        if [ "$STARTUP_SUCCESS" = "false" ]; then
          echo "API failed to start within timeout"
          docker logs mlops-api-container
          docker stop mlops-api-container
          docker rm mlops-api-container
          exit 1
        fi
        
        # Test health endpoint only; full prediction coverage runs in pytest.
        HEALTH_JSON=$(curl -sSf http://127.0.0.1:8000/health)
        echo "$HEALTH_JSON" | python -c 'import json,sys; data=json.load(sys.stdin); assert data["status"] in ("ok","degraded"); assert "model_ready" in data'
        
        # Stop and remove container
        docker stop mlops-api-container
        docker rm mlops-api-container

name: MLOps CI/CD

on:
  push:
    branches: [ main, feature/update-chat-model ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-xdist httpx

      - name: Run tests
        run: |
          mkdir -p artifacts
          pytest tests/ -v -n auto

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mlops-api .

      - name: Smoke test (health only)
        run: |
          docker run -d --name mlops-api-container -p 8000:8000 -e SKIP_TELEMETRY=1 mlops-api
          for i in {1..30}; do
            if curl -sSf --connect-timeout 2 http://127.0.0.1:8000/health > /dev/null; then
              echo "Health OK"
              docker stop mlops-api-container && docker rm mlops-api-container
              exit 0
            fi
            sleep 1
          done
          docker logs mlops-api-container
          docker stop mlops-api-container && docker rm mlops-api-container
          exit 1

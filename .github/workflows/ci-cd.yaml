name: MLOps CI/CD

on:
  push:
    branches: [ main, feature/update-chat-model ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest pytest-xdist httpx

      - name: Run tests
        run: |
          mkdir -p artifacts
          pytest tests/ -v -n auto

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mlops-api .

      - name: Smoke test API
        run: |
          docker run -d --name mlops-api-container -p 8000:8000 mlops-api

          STARTUP_SUCCESS=false
          for i in {1..60}; do
            if curl -sSf --connect-timeout 2 http://127.0.0.1:8000/health > /dev/null; then
              STARTUP_SUCCESS=true
              break
            fi
            sleep 1
          done

          if [ "$STARTUP_SUCCESS" = "false" ]; then
            echo "API failed to start"
            docker logs mlops-api-container
            docker stop mlops-api-container && docker rm mlops-api-container
            exit 1
          fi

          curl -sSf http://127.0.0.1:8000/ | python -c 'import json,sys;d=json.load(sys.stdin);assert"/predict"in d["endpoints"]'
          curl -sSf http://127.0.0.1:8000/health | python -c 'import json,sys;d=json.load(sys.stdin);assert d["status"]in("ok","degraded")'
          curl -sSf http://127.0.0.1:8000/docs > /dev/null
          curl -sSf http://127.0.0.1:8000/metrics | grep -q "api_request_duration_seconds"
          curl -sSf -X POST http://127.0.0.1:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"prompt":"Hello","max_new_tokens":10}' | \
            python -c 'import json,sys;d=json.load(sys.stdin);assert"generated_text"in d'

          docker stop mlops-api-container && docker rm mlops-api-container

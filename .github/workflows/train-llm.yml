name: Train LLM (Manual)

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: 'Hugging Face model id or local path to materialize'
        required: true
        default: 'sshleifer/tiny-gpt2'
      model_task:
        description: 'Model task/head to load'
        required: true
        type: choice
        options:
          - causal-lm
          - seq2seq-lm
          - masked-lm
        default: 'causal-lm'
      dataset_path:
        description: 'Optional path to training/evaluation data for lineage'
        required: false
        default: ''
      epochs:
        description: 'Training epochs to record or pass to custom training'
        required: true
        default: '0'
      learning_rate:
        description: 'Learning rate to record or pass to custom training'
        required: false
        default: ''
      artifact_dir:
        description: 'Directory to save the model artifact'
        required: true
        default: 'artifacts/model'
      dvc_remote:
        description: 'Optional DVC remote URL for pushing artifacts'
        required: false
        default: ''
      training_command:
        description: 'Optional custom command for provider/model-specific fine-tuning'
        required: false
        default: ''
      trust_remote_code:
        description: 'Allow custom remote code from the model repository'
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  train-llm:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: 3.9

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
        python -m pip install accelerate peft

    - name: Configure DVC
      env:
        DVC_REMOTE: ${{ inputs.dvc_remote }}
      run: |
        dvc init --no-scm
        if [ -n "$DVC_REMOTE" ]; then
          dvc remote add -d origin "$DVC_REMOTE"
          dvc pull || echo "No existing DVC data found, continuing with fresh artifact"
        else
          echo "No DVC remote configured; artifact will be added locally only"
        fi

    - name: Materialize or Train LLM Artifact
      env:
        LLM_MODEL_NAME: ${{ inputs.model_name }}
        LLM_MODEL_TASK: ${{ inputs.model_task }}
        LLM_DATASET_PATH: ${{ inputs.dataset_path }}
        LLM_EPOCHS: ${{ inputs.epochs }}
        LLM_LEARNING_RATE: ${{ inputs.learning_rate }}
        LLM_ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        LLM_TRUST_REMOTE_CODE: ${{ inputs.trust_remote_code }}
        TRAINING_COMMAND: ${{ inputs.training_command }}
      run: |
        if [ -n "$TRAINING_COMMAND" ]; then
          echo "Running custom LLM training command"
          bash -lc "$TRAINING_COMMAND"
        else
          TRUST_REMOTE_CODE_FLAG=""
          if [ "$LLM_TRUST_REMOTE_CODE" = "true" ]; then
            TRUST_REMOTE_CODE_FLAG="--trust-remote-code"
          fi

          python src/train.py \
            --model-name "$LLM_MODEL_NAME" \
            --model-task "$LLM_MODEL_TASK" \
            --artifact-dir "$LLM_ARTIFACT_DIR" \
            --dataset-path "$LLM_DATASET_PATH" \
            --epochs "$LLM_EPOCHS" \
            --learning-rate "$LLM_LEARNING_RATE" \
            $TRUST_REMOTE_CODE_FLAG
        fi

        test -d "$LLM_ARTIFACT_DIR"
        if [ ! -f "$LLM_ARTIFACT_DIR/pipeline_manifest.json" ]; then
          python -c 'import json, os, pathlib; artifact_dir = pathlib.Path(os.environ["LLM_ARTIFACT_DIR"]); manifest = {"model_name": os.environ["LLM_MODEL_NAME"], "model_task": os.environ["LLM_MODEL_TASK"], "dataset_path": os.environ["LLM_DATASET_PATH"] or None, "epochs": float(os.environ["LLM_EPOCHS"]), "learning_rate": os.environ["LLM_LEARNING_RATE"] or None, "artifact_dir": str(artifact_dir), "custom_training_command": bool(os.environ["TRAINING_COMMAND"]), "trust_remote_code": os.environ["LLM_TRUST_REMOTE_CODE"] == "true"}; (artifact_dir / "pipeline_manifest.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")'
        fi

    - name: Track LLM Artifact with DVC
      env:
        LLM_ARTIFACT_DIR: ${{ inputs.artifact_dir }}
        DVC_REMOTE: ${{ inputs.dvc_remote }}
      run: |
        dvc add "$LLM_ARTIFACT_DIR"
        if [ -n "$DVC_REMOTE" ]; then
          dvc push
        else
          echo "Skipping dvc push because dvc_remote was not provided"
        fi
        
    - name: Commit DVC changes (optional)
      env:
        LLM_ARTIFACT_DIR: ${{ inputs.artifact_dir }}
      run: |
        git config user.name "GitHub Actions"
        git config user.email "actions@github.com"
        git add "$LLM_ARTIFACT_DIR.dvc"
        git commit -m "Update DVC-tracked LLM artifact" || echo "No changes to commit"
        git push
